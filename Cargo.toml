[package]
name = "iroh-persist"
description = "Library to persist Iroh secret keys"
version = "0.1.6"
edition = "2024"
authors = ["Jeroen van Maanen"]
readme = "README.md"
homepage = "https://github.com/node2own/iroh-persist"
repository = "https://github.com/node2own/iroh-persist"
license = "MIT"

[dependencies]
dirs = "6.0.0"
ed25519-dalek = "2.2.0"
iroh = { version = "0.98", default-features = false }
n0-error = "0.1"
ssh-key = { version = "0.6.7", features = ["ed25519"] }
test-log = "0.2.18"
tokio = { version = "1.34.0", features = ["fs"] }
tracing = "0.1.40"

[dev-dependencies]
rand = "0.9.2"
